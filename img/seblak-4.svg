<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#FFF9DB" rx="16"/>
  <!-- Bowl -->
  <ellipse cx="300" cy="270" rx="190" ry="110" fill="#E8590C" opacity="0.15"/>
  <ellipse cx="300" cy="250" rx="180" ry="100" fill="#343A40"/>
  <ellipse cx="300" cy="245" rx="168" ry="90" fill="#C92A2A"/>
  <!-- Tulang Rangu Gurih -->
  <rect x="250" y="210" width="35" height="30" rx="8" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
  <rect x="310" y="215" width="40" height="28" rx="8" fill="#F8F9FA" stroke="#CED4DA" stroke-width="2"/>
  <rect x="275" y="235" width="30" height="25" rx="6" fill="#FFF5F5" stroke="#FFA8A8" stroke-width="2"/>
  <!-- Kerupuk Mawar Basah -->
  <circle cx="230" cy="245" r="28" fill="#FFEC99" stroke="#FCC419" stroke-width="2"/>
  <circle cx="365" cy="240" r="26" fill="#FFEC99" stroke="#FCC419" stroke-width="2"/>
  <!-- Rempah Cikur Kencur -->
  <circle cx="280" cy="265" r="8" fill="#7950F2" opacity="0.6"/>
  <circle cx="340" cy="260" r="7" fill="#F59F00"/>
  <circle cx="300" cy="275" r="9" fill="#E03131"/>
  <!-- Sayur & Daun Bawang -->
  <rect x="320" y="200" width="12" height="6" rx="2" fill="#51CF66" transform="rotate(30 320 200)"/>
  <rect x="270" y="205" width="12" height="6" rx="2" fill="#51CF66" transform="rotate(-20 270 205)"/>
  <!-- Uap -->
  <path d="M 285 130 Q 265 95 295 65" stroke="#E8590C" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 325 120 Q 345 90 320 60" stroke="#E8590C" stroke-width="4" fill="none" opacity="0.6"/>
  <!-- Label -->
  <rect x="180" y="380" width="240" height="40" rx="20" fill="#C82333"/>
  <text x="300" y="405" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Seblak Tulang Rangu Gurih</text>
</svg>
